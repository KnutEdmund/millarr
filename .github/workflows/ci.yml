# Build the firmware and run the speed engine's unit tests on every push and
# pull request. Runs on GitHub Actions (public mirror) and on Gitea Actions
# (private origin), which reads .github/workflows when .gitea/workflows is absent.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Unit tests (native)
        run: pio test -e native

      - name: Firmware build (esp32dev)
        run: pio run -e esp32dev
